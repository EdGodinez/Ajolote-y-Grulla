<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalogo</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />

  <!-- Iconos bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">

  <!-- Boxicons - Brand Icons -->
  <link href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css" rel="stylesheet">

  <!-- Estilos globales -->
  <link rel="stylesheet" href="./css/style.css" />

  <link rel="stylesheet" href="./css/pages/products/products.css" />
</head>


<body class="pt-5">
  <header id="header"></header>

  <main class="catalogo">
    <div class="container">

      <h1 class="display-4 fw-bold catalogo-title">Catálogo</h1>

      <p class="catalogo-subtitulo">
        Descubre nuestra selección de papelería japonesa:
        productos únicos que combinan creatividad, diseño y funcionalidad.
      </p>

      <!-- Boton agregar producto -->
      <div class="d-flex justify-content-end mb-4">
          <a href="./agregarProducto.html" class="btn btn-agregar-producto">
              <i class="bi bi-plus-lg me-2"></i>
              Agregar producto
          </a>
      </div>

      <!-- Barra de búsqueda -->
      <div class="buscador-productos mb-4">

        <i class="bi bi-search"></i>

        <input type="search" id="buscar-producto" placeholder="Buscar por nombre, marca o característica..."
          aria-label="Buscar productos">

      </div>

      <!-- Filtros -->
      <p class="filtros-titulo">Categorías</p>
      <div id="filtros-categorias" class="d-flex flex-wrap gap-2 mb-3"></div>

      <p class="filtros-titulo">Características</p>
      <div id="filtros-characteristics" class="d-flex flex-wrap gap-2 mb-4"></div>

      <!-- Listado de productos -->
      <div class="row g-4" id="lista-productos"></div>

      <p id="sin-resultados" class="text-center py-4 d-none">
        No encontramos productos que coincidan con tu búsqueda.
      </p>

    </div>
  </main>

  <!-- Footer compartido -->
  <footer id="footer"></footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <!-- Componentes globales -->
  <script type="module" src="./js/main.js"></script>
</body>

</html>
