<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- Iconos bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    
    <!-- Estilos globales -->
    <link rel="stylesheet" href="./css/style.css" />

    <link rel="stylesheet" href="./css/pages/products/products.css" />
</head>


<body class="pt-5">
     <header id="header"></header>

    <main class="catalogo py-4">
  <div class="container">
    <h2 class="mb-4">Catálogo</h2>

    <div class="row g-4">
      <!-- 2 por fila en celular, 3 en mediana, 4 en grande -->
      <div class="col-6 col-md-4 col-lg-3">
        <div class="card h-100">
          <img src="./assets/productos/images (1).png" class="card-img-top img-producto" alt="Producto 1">
          <div class="card-body">
            <h5 class="card-title">Producto</h5>
            <p class="card-text">Aquí vendrá la descripción del producto</p>
            <a href="#" class="btn btn-primary">Comprar</a>
          </div>
        </div>
      </div>

      <div class="col-6 col-md-4 col-lg-3">
        <div class="card h-100">
          <img src="./assets/productos/images (1).png" class="card-img-top img-producto" alt="Producto 2">
          <div class="card-body">
            <h5 class="card-title">Producto</h5>
            <p class="card-text">Aquí vendrá la descripción del producto</p>
            <a href="#" class="btn btn-primary">Comprar</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>



   <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

     <!-- Componentes globales -->
    <script type="module" src="./js/main.js"></script>
</body>
</html>
