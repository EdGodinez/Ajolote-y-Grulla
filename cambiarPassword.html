<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nueva Contraseña - Ajolote y Grulla</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Style CSS -->
    <link rel="stylesheet" href="./css/style.css" />

    <!-- Boxicons - Brand Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css" rel="stylesheet">
  </head>
  <body class="bg-light d-flex align-items-center justify-content-center vh-100 px-2 background-ondas">
      
    <div class="card shadow p-4 w-100" style="max-width: 400px;">
      <h2 class="text-center mb-3">Nueva contraseña</h2>
      <form id="form-nueva-password">
        <div class="mb-3">
          <label for="nuevaPassword" class="form-label">Ingresa tu nueva contraseña</label>
          <input
            type="password"
            id="nuevaPassword"
            class="form-control"
            placeholder="Mínimo 6 caracteres"
            required
          />
        </div>
        <button type="submit" class="btn btn-primary w-100">Actualizar contraseña</button>
      </form>
    </div>

    <script type="module" src="./js/pages/recovery-password/changePassword.js"></script>
  </body>
</html>
