<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- Style CSS -->
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="background-blanco">
    <div class="container py-1">
      <!-- BUTTON QUE RETROCEDE A LA ANTERIOR PAGINA EN EL HISTORIAL -->
      <div class="pb-2">
        <button
          class="btn btn-danger px-5 d-flex align-items-center shadow-sm"
          onclick="history.back()"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-square-arrow-left-exit preview-icon"
          >
            <path d="M13 12H3" />
            <path
              d="M3 17.67V19a2 2 0 002 2h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v1.33"
            />
            <path d="m7 8-4 4 4 4" />
          </svg>
        </button>
      </div>

      <div id="recovery-div">
        
      </div>
    </div>

    <script type="module" src="./js/pages/recovery-password/renderRecovery.js"></script>
  </body>
</html>
