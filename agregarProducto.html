
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar producto | Ajolote & Grulla</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <main class="container py-5">

        <h1 class="mb-3">Agregar producto</h1>
        <p class="mb-4">Completa los datos para registrar un nuevo producto.</p>

        <form id="form-agregar-producto" novalidate>

            <div class="row g-3">
                <!-- Nombre -->
            <!-- Nombre (Líneas 24 a 34) -->
                <div class="col-md-6 position-relative">
                    <label for="name" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="name" name="name" maxlength="77" required>
                    
                    <div id="alerttrade" class="invalid-tooltip position- static mt-1" style="display: none;">
                    </div>
                
                    <div id="alertname" class="invalid-feedback" style="display: none;"></div>                
                    <div class="d-flex justify-content-end mt-1">
                        <small id="contadorName" class="text-muted" style="font-size: 0.75rem;">0/77</small>
                    </div>
                </div>

                <!-- Marca -->
                <div class="col-md-6">
                    <label for="marca" class="form-label">Marca</label>
                    <input type="text" class="form-control" id="marca" name="marca" required>
                </div>

                <!-- Categoría -->
                <div class="col-md-6">
                    <label for="categoria" class="form-label">Categoría</label>
                    <select class="form-select" id="categoria" name="categoria" required>
                        <option value="">Selecciona una categoría</option>
                        <option value="Plumas y Lapiceros">Plumas y Lapiceros</option>
                        <option value="Accesorios">Accesorios</option>
                        <option value="Cintas Adhesivas">Cintas Adhesivas</option>
                        <option value="Útiles">Útiles</option>
                        <option value="Marcadores">Marcadores</option>
                    </select>
                </div>

                <!-- Características -->
                <div class="col-md-6">
                    <label class="form-label">Características</label>

                    <div id="caracteristicas">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox"
                                   name="caracteristicas" value="Divertido" id="divertido">
                            <label class="form-check-label" for="divertido">Divertido</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox"
                                   name="caracteristicas" value="Funcional" id="funcional">
                            <label class="form-check-label" for="funcional">Funcional</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox"
                                   name="caracteristicas" value="Elegante" id="elegante">
                            <label class="form-check-label" for="elegante">Elegante</label>
                        </div>
                    </div>
                </div>

                <!-- Premio -->
                <div class="col-md-6">
                    <label for="premio" class="form-label">Premio (opcional)</label>
                    <input type="text" class="form-control" id="premio" name="premio">
                </div>

                <!-- Precio -->
                <div class="col-md-6">
                    <label for="precio" class="form-label">Precio</label>
                    <input type="number" class="form-control" id="precio"
                           name="precio" min="0.01" step="0.01" required>
                </div>

                <!-- Imagen -->
                <div class="col-12">
                    <label for="imagen" class="form-label">Imagen (ruta o URL)</label>
                    <input type="text" class="form-control" id="imagen"
                           name="imagen" placeholder="./assets/productos/img.jpg" required>
                </div>

                <!-- Descripción -->
                <div class="col-12">
                    <label for="descripcion" class="form-label">Descripción</label>
                    <textarea class="form-control" id="descripcion" name="descripcion" rows="2" required></textarea>
                </div>

                <!-- Detalle-->
                <div class="col-12">
                    <label for="detail" class="form-label">Detalle</label>
                    <textarea class="form-control" id="detail" name="detail" rows="5"></textarea>
                </div>

                <!-- Botón -->
                <div class="col-12">
                    <button type="submit" class="btn btn-primary" id="btn-agregar-producto">
                        Agregar producto
                    </button>
                </div>

            </div>

        </form>

    </main>

    <script type="module" src="./js/pages/agregarProducto/agregarProducto.js"></script>

</body>
