<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agregar producto | Ajolote & Grulla</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Boxicons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Estilos globales -->
    <link rel="stylesheet" href="./css/style.css">

    <!-- Estilos específicos del formulario -->
    <link rel="stylesheet" href="./css/pages/agregarProducto/agregarProducto.css">
</head>

<body>

    <!-- Componente Navbar -->
    <header id="header"></header>

    <main class="product-section py-5">
        <div class="container">
            <div class="product-container">

                 <!-- BUTTON QUE RETROCEDE A LA ANTERIOR PAGINA EN EL HISTORIAL -->
                <div class="pb-4">
                    <button
                    class="btn btn-danger px-5 d-flex align-items-center shadow-sm"
                    onclick="history.back()"
                    >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="lucide lucide-square-arrow-left-exit preview-icon"
                    >
                        <path d="M13 12H3" />
                        <path
                        d="M3 17.67V19a2 2 0 002 2h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v1.33"
                        />
                        <path d="m7 8-4 4 4 4" />
                    </svg>
                    </button>
                </div>

                <h1 class="product-title mb-3">Agregar producto</h1>
                <p class="contact-description mb-4">Completa los datos para registrar un nuevo producto.</p>

                <form id="form-agregar-producto" novalidate>

                    <div class="row g-3">

                        <!-- Nombre -->
                        <div class="col-md-6">
                            <label for="name" class="form-label">Nombre</label>

                            <input
                                type="text"
                                class="form-control"
                                id="name"
                                name="name"
                                maxlength="77"
                                aria-describedby="error-name"
                                required
                            >

                            <div id="error-name" class="invalid-feedback"></div>

                            <div class="d-flex justify-content-end mt-1">
                                <small id="contadorName" class="text-muted">
                                    0/77
                                </small>
                            </div>
                        </div>


                        <!-- Marca -->
                        <div class="col-md-6">
                            <label for="brand" class="form-label">Marca</label>

                            <input
                                type="text"
                                class="form-control"
                                id="brand"
                                name="brand"
                                maxlength="50"
                                aria-describedby="error-brand"
                                required
                            >

                            <div id="error-brand" class="invalid-feedback"></div>
                        </div>

                        <!-- Categoría -->
                        <div class="col-md-6">
                            <label for="category" class="form-label">Categoría</label>

                            <select
                                class="form-select"
                                id="category"
                                name="category"
                                aria-describedby="error-category"
                                required
                            >
                                <option value="">Selecciona una categoría</option>
                                <option value="Plumas y Lapiceros">Plumas y Lapiceros</option>
                                <option value="Accesorios">Accesorios</option>
                                <option value="Cintas Adhesivas">Cintas Adhesivas</option>
                                <option value="Útiles">Útiles</option>
                                <option value="Marcadores">Marcadores</option>
                            </select>

                            <div id="error-category" class="invalid-feedback"></div>
                        </div>

                        <!-- Características -->
                        <div class="col-md-6">
                            <label class="form-label">Características</label>

                            <div id="caracteristicas">

                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox"
                                           name="characteristics" value="Aesthetic" id="aesthetic" aria-describedby="error-characteristics">
                                    <label class="form-check-label" for="aesthetic">Aesthetic</label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox"
                                           name="characteristics" value="Creativo" id="creativo" aria-describedby="error-characteristics">
                                    <label class="form-check-label" for="creativo">Creativo</label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox"
                                           name="characteristics" value="Diseño inteligente" id="diseno-inteligente" aria-describedby="error-characteristics">
                                    <label class="form-check-label" for="diseno-inteligente">Diseño inteligente</label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox"
                                           name="characteristics" value="Diseño minimalista" id="diseno-minimalista" aria-describedby="error-characteristics">
                                    <label class="form-check-label" for="diseno-minimalista">Diseño minimalista</label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox"
                                           name="characteristics" value="Divertido" id="divertido" aria-describedby="error-characteristics">
                                    <label class="form-check-label" for="divertido">Divertido</label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox"
                                           name="characteristics" value="Elegante" id="elegante" aria-describedby="error-characteristics">
                                    <label class="form-check-label" for="elegante">Elegante</label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox"
                                           name="characteristics" value="Ergonómico" id="ergonomico" aria-describedby="error-characteristics">
                                    <label class="form-check-label" for="ergonomico">Ergonómico</label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox"
                                           name="characteristics" value="Innovador" id="innovador" aria-describedby="error-characteristics">
                                    <label class="form-check-label" for="innovador">Innovador</label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox"
                                           name="characteristics" value="Multifuncional" id="multifuncional" aria-describedby="error-characteristics">
                                    <label class="form-check-label" for="multifuncional">Multifuncional</label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox"
                                           name="characteristics" value="No sabía que lo necesitaba" id="no-sabiia" aria-describedby="error-characteristics">
                                    <label class="form-check-label" for="no-sabiia">No sabía que lo necesitaba</label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox"
                                           name="characteristics" value="Original" id="original" aria-describedby="error-characteristics">
                                    <label class="form-check-label" for="original">Original</label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox"
                                           name="characteristics" value="Practico" id="practico" aria-describedby="error-characteristics">
                                    <label class="form-check-label" for="practico">Practico</label>
                                </div>
                            </div>

                            <div
                                id="error-characteristics"
                                class="text-danger small mt-2"
                                role="alert"
                                hidden
                            ></div>
                        </div>

                        <!-- Premio -->
                        <div class="col-md-6">
                            <label for="award" class="form-label">
                                Premio (opcional)
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="award"
                                name="award"
                                aria-describedby="error-award"
                            >

                            <div id="error-award" class="invalid-feedback"></div>
                        </div>

                        <!-- Precio -->
                        <div class="col-md-6">
                            <label for="price" class="form-label">Precio</label>

                            <input
                                type="number"
                                class="form-control"
                                id="price"
                                name="price"
                                min="0.01"
                                step="0.01"
                                aria-describedby="error-price"
                                required
                            >

                            <div id="error-price" class="invalid-feedback"></div>
                        </div>

                        <!-- Imagen -->
                        <div class="col-12">
                            <label for="img" class="form-label">
                                Imagen (ruta o URL)
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="img"
                                name="img"
                                placeholder="./assets/productos/img.jpg"
                                aria-describedby="error-img"
                                required
                            >

                            <div id="error-img" class="invalid-feedback"></div>
                        </div>

                        <!-- Descripción -->
                        <div class="col-12">
                            <label for="description" class="form-label">
                                Descripción
                            </label>

                            <textarea
                                class="form-control"
                                id="description"
                                name="description"
                                rows="2"
                                maxlength="500"
                                aria-describedby="error-description"
                                required
                            ></textarea>

                            <div id="error-description" class="invalid-feedback"></div>
                        </div>

                        <!-- Detalle -->
                        <div class="col-12">
                            <label for="detail" class="form-label">Detalle</label>

                            <textarea
                                class="form-control"
                                id="detail"
                                name="detail"
                                rows="5"
                                maxlength="800"
                                aria-describedby="error-detail"
                                required
                            ></textarea>

                            <div id="error-detail" class="invalid-feedback"></div>
                        </div>

                        <!-- Botones -->
                        <div class="col-12">
                            <button type="button" class="btn btn-secondary mt-3" id="btn-limpiarFormulario">
                                Limpiar
                            </button>

                            <button type="submit" class="btn btn-primary contact-button mt-3" id="btn-agregar-producto">
                                Agregar producto
                            </button>
                        </div>

                    </div>

                </form>

            </div>
        </div>
    </main>

    <!-- Componente Footer -->
    <footer id="footer"></footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- Componentes globales (Para cargar el header y footer) -->
    <script type="module" src="./js/main.js"></script>

    <!-- Lógica de la página -->
    <script type="module" src="./js/pages/agregarProducto/agregarProducto.js"></script>

</body>

</html>
