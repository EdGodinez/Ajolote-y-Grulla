<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- Style CSS -->
    <link rel="stylesheet" href="./css/style.css" />
    <!-- Login CSS -->
    <link rel="stylesheet" href="./css/pages/login/login.css" />

    <!-- Iconos bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    
  </head>
  <body class="background-blanco">
    <header id="header"></header>

    <div class="container py-5">
      <div
        class="card position-relative overflow-hidden shadow mt-3"
        style="min-height: 580px"
      >
        <div class="row g-0 h-100 align-items-center">
          
          <!-- ===============
                INICIAR SESION 
                 =============== -->
          <div class="col-12 col-md-6 p-4 d-block" id="col-login"></div>
          <!-- ===============
                REGISTRARSE 
                 =============== -->
          <div class="col-12 col-md-6 p-4 d-none d-md-block" id="col-register">
            
          </div>
          <!-- ===============
                AJOLOTE&GRULLA 
                 =============== -->
          <div
            id="col-overlay"
            class="col-12 col-md-6 d-flex justify-content-center flex-column p-3 position-absolute h-100 z-2 top-0 end-0 d-m"
            style="background-color: #fdfaf6"
          >
            <img
              src="./assets/images/Ajolote&Grulla-LoginRegister.svg"
              class="mb-2"
              style="max-height: 380px; object-fit: contain"
              alt="imagen de Ajolote & Grulla"
            />
            <div class="text-center">
              <h5>Tu mundo favorito, siempre contigo</h5>
              <p class="m-0 text-muted px-5">
                Inicia sesión para guardar tus productos favoritos, reastrear
                tus pedidos y disfrutar de una experiencia personalizada.
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer compartido -->
    <footer id="footer"></footer>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script type="module" src="./js/pages/login/renderLogin.js"></script>
    <!-- Componentes globales -->
  <script type="module" src="./js/main.js"></script>

  </body>
</html>
