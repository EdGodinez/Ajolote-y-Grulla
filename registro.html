<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="formularios">
    <h1>Crear Cuenta</h1>
    <form action="/registro" method="post">
        <fieldset>
            <legend>Datos personales y de acceso</legend>
            
            <div class="input-group">
                <label for="fullname">Nombre Completo</label>
                <input type="text" id="fullname" name="fullname" autocomplete="name" required placeholder="Tu nombre completo">
            </div>

            <div class="input-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" autocomplete="email" required placeholder="correo@ejemplo.com">
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" autocomplete="new-password" required placeholder="Crea una contraseña">
            </div>

            <div class="input-group">
                <label for="confirm-password">Confirmar contraseña</label>
                <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required placeholder="Confirma tu contraseña">
            </div>
            
            <button type="submit">Crear cuenta</button>
        </fieldset>

        <div class="iniciar-sesion">
            <p>¿Ya tienes cuenta? <a href="login.html">Iniciar Sesión</a></p>
        </div>
    </form>
</div>
<script type="module" src="./js/pages/about/registro.js"></script>
</body>
</html>
