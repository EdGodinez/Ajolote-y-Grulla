<div id="carrusellayg" class="carousel slide">

    <button type="button" data-bs-target="#carrusellayg" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
    <button type="button" data-bs-target="#carrusellayg" data-bs-slide-to="1" aria-label="Slide 2"></button>
    <button type="button" data-bs-target="#carrusellayg" data-bs-slide-to="2" aria-label="Slide 3"></button>
  </div>

<!--termina botones de abajo-->


  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="/Ajolote-y-Grulla/assets/carusell/1.jpg" class="d-block w-100" alt="...">
      <div class="carousel-caption d-none d-md-block">
        <h5>First slide label</h5>
        <p>Some representative placeholder content for the first slide.</p>
      </div>
    </div>
    <div class="carousel-item">
      <img src="/Ajolote-y-Grulla/assets/carusell/2.jpg" class="d-block w-100" alt="...">

    <div class="carousel-item">

    </div>
  </div>

  <!-- estos son los botenes de skip-->
  <button class="carousel-control-prev" type="button" data-bs-target="#carrusellayg" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carrusellayg" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
